name: Build Vela Dictionary RPK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dictionary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test query engine
        run: npm test
      - name: Install fixed toolchain
        run: |
          npm install -g aiot-toolkit@2.0.5 @aiot-toolkit/jsc@1.0.7
          ln -s "$(npm root -g)" node_modules
          python3 -m pip install --break-system-packages --require-hashes -r scripts/dictionary-requirements.txt
      - name: Generate offline assets
        run: |
          python3 scripts/build_dictionary.py --output src/common/dict --count 14000 --max-words 18000
          python3 scripts/icon.py
          node scripts/check_dictionary.mjs
      - name: Build signed installable RPK
        env:
          VELA_PRIVATE_KEY: ${{ secrets.VELA_PRIVATE_KEY }}
          VELA_CERTIFICATE: ${{ secrets.VELA_CERTIFICATE }}
        run: |
          if [ -n "$VELA_PRIVATE_KEY" ] && [ -n "$VELA_CERTIFICATE" ]; then
            mkdir -p sign/release
            printf '%s\n' "$VELA_PRIVATE_KEY" > sign/release/private.pem
            printf '%s\n' "$VELA_CERTIFICATE" > sign/release/certificate.pem
            npm run release
          else
            npm run build
          fi
      - name: Verify package and size
        run: python3 scripts/verify_rpk.py
      - uses: actions/upload-artifact@v4
        with:
          name: dictionary-rpk
          path: |
            dist/*.rpk
            src/common/dict/meta.json
            src/common/dict/licenses.json
          if-no-files-found: error
      - name: Publish raw RPK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" dist/*.rpk --target "$GITHUB_SHA" --title "口袋词典 build ${GITHUB_RUN_NUMBER}" --notes "336×480 小米手环9 Pro。完整离线词库；安装原始 .rpk。未配置 VELA 签名 Secrets 时使用工具链开发签名，真机兼容性待验证。" --prerelease
